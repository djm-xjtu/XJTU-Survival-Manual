<header class="site-header" id="site-header">
  <div class="header-inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="30" height="30" fill="none">
          <rect width="32" height="32" rx="9" fill="url(#bg-grad)"/>
          <path d="M8 21.5c3.4-1.1 5.6-3.4 6.6-6.9M16 8v16M23.8 21.5c-3.4-1.1-5.6-3.4-6.6-6.9" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
          <defs>
            <linearGradient id="bg-grad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
              <stop stop-color="#1b4d8f"/><stop offset="1" stop-color="#0d2b4e"/>
            </linearGradient>
          </defs>
        </svg>
      </span>
      <span class="brand-text">
        <strong>西安交大生存指南</strong>
        <small>XJTU Survival Manual</small>
      </span>
    </a>

    <nav class="site-nav" aria-label="主导航">
      <a href="{{ '/' | relative_url }}#guide">新人科普</a>
      <a href="{{ '/' | relative_url }}#major">专业自救</a>
      <a href="{{ '/' | relative_url }}#extra">拓展资源</a>
      <a href="{{ site.github_repo_url }}" target="_blank" rel="noopener">贡献</a>
    </nav>

    <div class="header-actions">
      <button class="icon-btn search-trigger" id="search-trigger" aria-label="搜索文章">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <span class="kbd-hint">搜索 <kbd>/</kbd></span>
      </button>
      <button class="icon-btn" id="theme-toggle" aria-label="切换深浅色主题" title="切换主题">
        <svg class="i-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/></svg>
        <svg class="i-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 019.5 4a8.5 8.5 0 1010.5 10.5z"/></svg>
      </button>
      <a class="icon-btn" href="{{ site.github_repo_url }}" target="_blank" rel="noopener" aria-label="GitHub 仓库" title="GitHub">
        <svg viewBox="0 0 16 16" width="18" height="18" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.4 7.4 0 014 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
      </a>
      <button class="icon-btn menu-btn" id="menu-btn" aria-label="打开菜单">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
  </div>
</header>

<div class="mobile-drawer" id="mobile-drawer" hidden>
  <div class="drawer-panel">
    <div class="drawer-head">
      <strong>目录</strong>
      <button class="icon-btn" id="drawer-close" aria-label="关闭菜单">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    {% include article-nav.html %}
  </div>
</div>

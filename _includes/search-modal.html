<div class="search-modal" id="search-modal" hidden>
  <div class="search-backdrop" data-close-search></div>
  <div class="search-panel" role="dialog" aria-modal="true" aria-label="站内搜索">
    <div class="search-box">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input type="search" id="search-input" placeholder="搜索文章内容，如：转专业、绩点、竞赛、雅思…" autocomplete="off" spellcheck="false">
      <button class="esc-btn" data-close-search>ESC</button>
    </div>
    <div class="search-results" id="search-results">
      <p class="search-hint">输入关键词开始搜索，支持全文检索所有文章。</p>
    </div>
  </div>
</div>
